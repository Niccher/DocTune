name: CI Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint-and-test:
    name: Lint, Type Check & Unit Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: doctune
          POSTGRES_PASSWORD: doctune_test_password
          POSTGRES_DB: doctune_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,web,eval]"
          pip install psycopg2-binary alembic

      - name: Run Database Migrations (I-04)
        env:
          POSTGRES_URL: postgresql://doctune:doctune_test_password@localhost:5432/doctune_test
        run: |
          alembic upgrade head

      - name: Run Code Linter (ruff)
        run: |
          ruff check web pipeline tests --ignore E501,E402,F401,F841 || true

      - name: Zero-Fake Data Verification Gate
        run: |
          ! grep -rni "maria chen\|diesel auxiliary" web pipeline

      - name: Run Test Suite
        env:
          DOCTUNE_ENV: testing
          SECRET_KEY: test_secret_key_for_ci_pipeline_32bytes_long!
          POSTGRES_URL: postgresql://doctune:doctune_test_password@localhost:5432/doctune_test
          REDIS_URL: redis://localhost:6379/0
        run: |
          python tests/test_simulation.py
          python tests/test_audit_overhaul.py
          python tests/test_web.py

  cpu-smoke-test:
    name: CPU Fine-Tuning Smoke Test (SmolLM2-135M)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install ML Worker Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[worker]"

      - name: Run 5-Step CPU Fine-Tuning Smoke Test
        run: |
          python -m pipeline.train_lora \
            --model-id "HuggingFaceTB/SmolLM2-135M-Instruct" \
            --epochs 1 \
            --batch-size 1 \
            --grad-accum 1 \
            --lr 0.0005 \
            --max-seq-length 128 \
            --max-steps 5 || true
