# ==============================================================================
# DocTune Studio — Multi-Container Distributed Stack
# ==============================================================================
# Services:
#   1. postgres      : PostgreSQL 16 relational database (runs, metrics, metadata)
#   2. redis         : Redis 7 broker & real-time telemetry Pub/Sub
#   3. minio         : MinIO S3-compatible object store (raw docs, datasets, weights)
#   4. web           : FastAPI Studio & AdminLTE v4 UI (port 80)
#   5. celery_worker : PyTorch distributed training & data preparation worker
#   6. dozzle        : Real-time container log viewer & monitoring (port 8888)
# ==============================================================================

services:
  # ── 1. PostgreSQL Database ──────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: doctune-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-doctune_studio}
      POSTGRES_USER: ${POSTGRES_USER:-doctune}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-doctune_secure_password_2026}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-doctune} -d ${POSTGRES_DB:-doctune_studio}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - doctune-net

  # ── 2. Redis Message Broker & Telemetry Pub/Sub ────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: doctune-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 3s
    networks:
      - doctune-net

  # ── 3. MinIO S3 Object Store ────────────────────────────────────────────────
  minio:
    image: cgr.dev/chainguard/minio:latest
    container_name: doctune-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin_secure_password_2026}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:9000/minio/health/live || curl -f http://127.0.0.1:9000/minio/health/live || minio --version || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - doctune-net

  # ── 4. Web Studio & FastAPI Application ─────────────────────────────────────
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: doctune-web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-80}:80"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - PORT=80
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-doctune}:${POSTGRES_PASSWORD:-doctune_secure_password_2026}@postgres:5432/${POSTGRES_DB:-doctune_studio}
      - DATABASE_URL_SYNC=postgresql+psycopg2://${POSTGRES_USER:-doctune}:${POSTGRES_PASSWORD:-doctune_secure_password_2026}@postgres:5432/${POSTGRES_DB:-doctune_studio}
      - REDIS_URL=redis://redis:6379/0
      - S3_ENDPOINT_URL=http://minio:9000
    volumes:
      - ./config:/app/config
      - ./alembic:/app/alembic
      - ./alembic.ini:/app/alembic.ini:ro
      - ./raw_documents:/app/raw_documents
      - ./data:/app/data
      - ./output_qlora:/app/output_qlora
      - ./output_lora:/app/output_lora
      - ./output_fft:/app/output_fft
      - ./output_merged:/app/output_merged
      - scratch_data:/app/.scratch
      - hf_cache:/root/.cache/huggingface
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:80/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - doctune-net

  # ── 5. Celery ML Fine-Tuning Worker ─────────────────────────────────────────
  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: doctune-celery-worker
    restart: unless-stopped
    shm_size: '8gb'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-doctune}:${POSTGRES_PASSWORD:-doctune_secure_password_2026}@postgres:5432/${POSTGRES_DB:-doctune_studio}
      - DATABASE_URL_SYNC=postgresql+psycopg2://${POSTGRES_USER:-doctune}:${POSTGRES_PASSWORD:-doctune_secure_password_2026}@postgres:5432/${POSTGRES_DB:-doctune_studio}
      - REDIS_URL=redis://redis:6379/0
      - S3_ENDPOINT_URL=http://minio:9000
      - PYTHONUNBUFFERED=1
    volumes:
      - ./config:/app/config
      - ./alembic:/app/alembic
      - ./alembic.ini:/app/alembic.ini:ro
      - ./raw_documents:/app/raw_documents
      - ./data:/app/data
      - ./output_qlora:/app/output_qlora
      - ./output_lora:/app/output_lora
      - ./output_fft:/app/output_fft
      - ./output_merged:/app/output_merged
      - scratch_data:/app/.scratch
      - hf_cache:/root/.cache/huggingface
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - doctune-net

  # ── 6. Dozzle Real-Time Container Log Viewer & Monitoring ─────────────────
  dozzle:
    image: amir20/dozzle:latest
    container_name: doctune-dozzle
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - "${DOZZLE_PORT:-8888}:8080"
    environment:
      - DOZZLE_LEVEL=info
      - DOZZLE_NO_ANALYTICS=true
    networks:
      - doctune-net

  # ── 7. Optional In-Docker Ollama Engine (Synthetic Q&A Teacher) ────────────
  ollama:
    image: ollama/ollama:latest
    container_name: doctune-ollama
    restart: unless-stopped
    profiles:
      - ollama
      - local-llm
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama_models:/root/.ollama
    networks:
      - doctune-net

# ── Volumes & Networks ────────────────────────────────────────────────────────
volumes:
  pg_data:
    name: doctune_pg_data
  redis_data:
    name: doctune_redis_data
  minio_data:
    name: doctune_minio_data
  scratch_data:
    name: doctune_scratch_data
  hf_cache:
    name: doctune_hf_cache
  ollama_models:
    name: doctune_ollama_models

networks:
  doctune-net:
    name: doctune_network
    driver: bridge
