<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page_title }}</title>

  <!-- Google Font: Source Sans 3 -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Sans+3:ital,wght@0,300;0,400;0,600;0,700;1,400&display=swap">
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <!-- AdminLTE v4 CSS (Bootstrap 5) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/admin-lte@4.0.0-beta3/dist/css/adminlte.min.css">
  <!-- Custom Overrides -->
  <link rel="stylesheet" href="/static/css/custom.css">

  <style>
    body {
      background: radial-gradient(circle at 50% 20%, rgba(13, 110, 253, 0.08), transparent 70%),
                  radial-gradient(circle at 80% 80%, rgba(16, 185, 129, 0.05), transparent 60%),
                  var(--bs-body-bg);
      min-height: 100vh;
    }
    .auth-card {
      width: 100%;
      max-width: 440px;
      border-radius: 14px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
      border: 1px solid rgba(0,0,0,0.08);
    }
    [data-bs-theme="dark"] .auth-card {
      border: 1px solid rgba(255,255,255,0.08);
      box-shadow: 0 10px 30px rgba(0,0,0,0.35);
    }
    .brand-icon-bubble {
      width: 52px;
      height: 52px;
      border-radius: 12px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: rgba(13, 110, 253, 0.12);
      color: #0d6efd;
      font-size: 1.75rem;
    }
  </style>
</head>
<body class="d-flex align-items-center justify-content-center p-3">

  <div class="auth-card card bg-body">
    <div class="card-body p-4 p-sm-5">
      
      <!-- Brand Header -->
      <div class="text-center mb-4">
        <div class="brand-icon-bubble mb-2">
          <i class="bi bi-layers-fill"></i>
        </div>
        <h4 class="fw-bold mb-1">{{ app_name }}</h4>
        <p class="text-muted small mb-0">Sign in to manage LLM fine-tuning pipelines</p>
      </div>

      <!-- Alert Placeholder -->
      <div id="alertBox" class="alert alert-danger d-none py-2 px-3 small rounded-3 mb-3" role="alert">
        <div class="d-flex align-items-center gap-2">
          <i class="bi bi-exclamation-triangle-fill flex-shrink-0"></i>
          <span id="alertMsg"></span>
        </div>
      </div>

      <!-- Login Form -->
      <form id="loginForm" method="POST" action="/api/v1/auth/login" novalidate>
        <input type="hidden" name="next" value="{{ next_url }}">

        <div class="mb-3">
          <label for="identifierInput" class="form-label small fw-semibold">Email or Username</label>
          <div class="input-group">
            <span class="input-group-text bg-body-tertiary"><i class="bi bi-person"></i></span>
            <input type="text" class="form-control" id="identifierInput" name="email_or_username" placeholder="user@company.com or username" required autofocus autocomplete="username">
          </div>
        </div>

        <div class="mb-3">
          <div class="d-flex justify-content-between align-items-center mb-1">
            <label for="passwordInput" class="form-label small fw-semibold mb-0">Password</label>
            <a href="/forgot-password" class="small text-decoration-none text-primary">Forgot password?</a>
          </div>
          <div class="input-group">
            <span class="input-group-text bg-body-tertiary"><i class="bi bi-lock"></i></span>
            <input type="password" class="form-control" id="passwordInput" name="password" placeholder="••••••••" required autocomplete="current-password">
            <button class="btn btn-outline-secondary" type="button" id="togglePasswordBtn" title="Toggle password visibility">
              <i class="bi bi-eye" id="toggleIcon"></i>
            </button>
          </div>
        </div>

        <div class="form-check mb-4">
          <input class="form-check-input" type="checkbox" id="rememberMe" name="remember_me" value="true" checked>
          <label class="form-check-label small text-muted" for="rememberMe">
            Remember this session for 30 days
          </label>
        </div>

        <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold d-flex align-items-center justify-content-center gap-2 rounded-3" id="submitBtn">
          <span id="btnText">Sign In</span>
          <span id="btnSpinner" class="spinner-border spinner-border-sm d-none" role="status" aria-hidden="true"></span>
        </button>
      </form>

      <!-- Footer Links -->
      <div class="text-center mt-4 pt-2 border-top">
        <p class="small text-muted mb-0">
          Need an account?
          <a href="/register" class="fw-semibold text-primary text-decoration-none">Create account</a>
        </p>
      </div>

    </div>
  </div>

  <!-- Bootstrap 5 JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    // Theme auto-detection from system/cookie
    const savedTheme = localStorage.getItem('theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    document.documentElement.setAttribute('data-bs-theme', savedTheme);

    // Toggle Password Visibility
    const toggleBtn = document.getElementById('togglePasswordBtn');
    const pwdInput = document.getElementById('passwordInput');
    const toggleIcon = document.getElementById('toggleIcon');
    if (toggleBtn && pwdInput) {
      toggleBtn.addEventListener('click', () => {
        const isPassword = pwdInput.type === 'password';
        pwdInput.type = isPassword ? 'text' : 'password';
        toggleIcon.className = isPassword ? 'bi bi-eye-slash' : 'bi bi-eye';
      });
    }

    // Form Submission with asynchronous fetch
    const loginForm = document.getElementById('loginForm');
    const alertBox = document.getElementById('alertBox');
    const alertMsg = document.getElementById('alertMsg');
    const submitBtn = document.getElementById('submitBtn');
    const btnText = document.getElementById('btnText');
    const btnSpinner = document.getElementById('btnSpinner');

    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      alertBox.classList.add('d-none');

      const identifier = document.getElementById('identifierInput').value.trim();
      const password = pwdInput.value;
      const rememberMe = document.getElementById('rememberMe').checked;

      if (!identifier || !password) {
        alertMsg.innerText = 'Please enter both identifier and password.';
        alertBox.classList.remove('d-none');
        return;
      }

      // UI loading state
      submitBtn.disabled = true;
      btnSpinner.classList.remove('d-none');
      btnText.innerText = 'Authenticating...';

      try {
        const res = await fetch('/api/v1/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            email_or_username: identifier,
            password: password,
            remember_me: rememberMe
          })
        });

        const data = await res.json();
        if (res.ok && data.status === 'success') {
          // Set operator localStorage if present
          if (data.user) {
            localStorage.setItem('doctune_operator', data.user.full_name || data.user.username);
          }
          const rawNext = new URLSearchParams(window.location.search).get('next') || '';
          let nextUrl = '/dashboard';
          if (rawNext && rawNext.startsWith('/') && !rawNext.startsWith('//') && !rawNext.includes('\\') && rawNext !== '/') {
            nextUrl = rawNext;
          }
          window.location.href = nextUrl;
        } else {
          alertMsg.innerText = data.message || 'Authentication failed. Please verify credentials.';
          alertBox.classList.remove('d-none');
          submitBtn.disabled = false;
          btnSpinner.classList.add('d-none');
          btnText.innerText = 'Sign In';
        }
      } catch (err) {
        alertMsg.innerText = 'Network error during login. Please try again.';
        alertBox.classList.remove('d-none');
        submitBtn.disabled = false;
        btnSpinner.classList.add('d-none');
        btnText.innerText = 'Sign In';
      }
    });
  </script>
</body>
</html>
