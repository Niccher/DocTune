<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page_title }}</title>

  <!-- Google Font: Source Sans 3 -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Sans+3:ital,wght@0,300;0,400;0,600;0,700;1,400&display=swap">
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <!-- AdminLTE v4 CSS (Bootstrap 5) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/admin-lte@4.0.0-beta3/dist/css/adminlte.min.css">
  <!-- Custom Overrides -->
  <link rel="stylesheet" href="/static/css/custom.css">

  <style>
    body {
      background: radial-gradient(circle at 50% 20%, rgba(13, 110, 253, 0.08), transparent 70%),
                  radial-gradient(circle at 80% 80%, rgba(16, 185, 129, 0.05), transparent 60%),
                  var(--bs-body-bg);
      min-height: 100vh;
    }
    .auth-card {
      width: 100%;
      max-width: 440px;
      border-radius: 14px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
      border: 1px solid rgba(0,0,0,0.08);
    }
    [data-bs-theme="dark"] .auth-card {
      border: 1px solid rgba(255,255,255,0.08);
      box-shadow: 0 10px 30px rgba(0,0,0,0.35);
    }
    .brand-icon-bubble {
      width: 52px;
      height: 52px;
      border-radius: 12px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: rgba(13, 110, 253, 0.12);
      color: #0d6efd;
      font-size: 1.75rem;
    }
  </style>
</head>
<body class="d-flex align-items-center justify-content-center p-3">

  <div class="auth-card card bg-body">
    <div class="card-body p-4 p-sm-5">
      
      <!-- Brand Header -->
      <div class="text-center mb-4">
        <div class="brand-icon-bubble mb-2">
          <i class="bi bi-key-fill text-success"></i>
        </div>
        <h4 class="fw-bold mb-1">Set New Password</h4>
        <p class="text-muted small mb-0">{{ app_name }}</p>
      </div>

      <!-- Alert Placeholder -->
      <div id="alertBox" class="alert alert-danger d-none py-2 px-3 small rounded-3 mb-3" role="alert">
        <div class="d-flex align-items-center gap-2">
          <i class="bi bi-exclamation-triangle-fill flex-shrink-0"></i>
          <span id="alertMsg"></span>
        </div>
      </div>

      <!-- Success Notification Box -->
      <div id="successBox" class="alert alert-success d-none py-3 px-3 rounded-3 mb-3 small" role="alert">
        <div class="d-flex align-items-center gap-2 fw-semibold mb-1">
          <i class="bi bi-check-circle-fill text-success"></i>
          <span>Password Successfully Updated!</span>
        </div>
        <p class="mb-3 text-muted">You can now sign in using your new password credentials.</p>
        <a href="/login" class="btn btn-sm btn-success w-100 py-2 fw-semibold">Sign In Now &rarr;</a>
      </div>

      <!-- Form -->
      <form id="resetForm" novalidate>
        <input type="hidden" id="tokenInput" value="{{ token }}">

        {% if not token %}
        <div class="mb-3">
          <label for="manualTokenInput" class="form-label small fw-semibold">Recovery Token</label>
          <input type="text" class="form-control" id="manualTokenInput" placeholder="Paste 64-char reset token" required>
        </div>
        {% endif %}

        <div class="mb-3">
          <label for="passwordInput" class="form-label small fw-semibold">New Password</label>
          <div class="input-group">
            <span class="input-group-text bg-body-tertiary"><i class="bi bi-lock"></i></span>
            <input type="password" class="form-control" id="passwordInput" placeholder="Min. 8 characters" required autocomplete="new-password">
          </div>
        </div>

        <div class="mb-4">
          <label for="confirmPasswordInput" class="form-label small fw-semibold">Confirm New Password</label>
          <div class="input-group">
            <span class="input-group-text bg-body-tertiary"><i class="bi bi-check2-circle"></i></span>
            <input type="password" class="form-control" id="confirmPasswordInput" placeholder="Re-enter password" required autocomplete="new-password">
          </div>
        </div>

        <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold d-flex align-items-center justify-content-center gap-2 rounded-3" id="submitBtn">
          <span id="btnText">Save New Password</span>
          <span id="btnSpinner" class="spinner-border spinner-border-sm d-none" role="status" aria-hidden="true"></span>
        </button>
      </form>

      <!-- Back to Sign in -->
      <div class="text-center mt-4 pt-2 border-top">
        <p class="small text-muted mb-0">
          Remembered your password?
          <a href="/login" class="fw-semibold text-primary text-decoration-none">Sign in</a>
        </p>
      </div>

    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    const savedTheme = localStorage.getItem('theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    document.documentElement.setAttribute('data-bs-theme', savedTheme);

    const form = document.getElementById('resetForm');
    const alertBox = document.getElementById('alertBox');
    const alertMsg = document.getElementById('alertMsg');
    const successBox = document.getElementById('successBox');
    const submitBtn = document.getElementById('submitBtn');
    const btnText = document.getElementById('btnText');
    const btnSpinner = document.getElementById('btnSpinner');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      alertBox.classList.add('d-none');

      let token = document.getElementById('tokenInput')?.value?.trim();
      const manualTokenEl = document.getElementById('manualTokenInput');
      if (!token && manualTokenEl) {
        token = manualTokenEl.value.trim();
      }

      const password = document.getElementById('passwordInput').value;
      const confirmPassword = document.getElementById('confirmPasswordInput').value;

      if (!token) {
        alertMsg.innerText = 'Reset token is missing or expired.';
        alertBox.classList.remove('d-none');
        return;
      }

      if (password.length < 8) {
        alertMsg.innerText = 'Password must be at least 8 characters long.';
        alertBox.classList.remove('d-none');
        return;
      }

      if (password !== confirmPassword) {
        alertMsg.innerText = 'Passwords do not match.';
        alertBox.classList.remove('d-none');
        return;
      }

      submitBtn.disabled = true;
      btnSpinner.classList.remove('d-none');
      btnText.innerText = 'Updating Password...';

      try {
        const res = await fetch('/api/v1/auth/reset-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            token: token,
            password: password
          })
        });

        const data = await res.json();
        submitBtn.disabled = false;
        btnSpinner.classList.add('d-none');
        btnText.innerText = 'Save New Password';

        if (res.ok && data.status === 'success') {
          form.classList.add('d-none');
          successBox.classList.remove('d-none');
        } else {
          alertMsg.innerText = data.message || 'Password reset failed.';
          alertBox.classList.remove('d-none');
        }
      } catch (err) {
        alertMsg.innerText = 'Network error during password reset.';
        alertBox.classList.remove('d-none');
        submitBtn.disabled = false;
        btnSpinner.classList.add('d-none');
        btnText.innerText = 'Save New Password';
      }
    });
  </script>
</body>
</html>
