openapi: 3.0.3
info:
  title: DocTune Studio REST API
  description: Canonical versioned API specifications for DocTune Studio private document fine-tuning platform.
  version: 1.0.0
servers:
  - url: http://localhost:4444
    description: Local Docker & Native Web Studio
paths:
  /health:
    get:
      summary: Healthcheck Probe
      description: Returns service health status and storage connectivity.
      responses:
        '200':
          description: Healthy status response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: healthy
                  app:
                    type: string
                    example: DocTune Studio
                  version:
                    type: string
                    example: 1.0.0
                  s3_storage:
                    type: boolean
                    example: true

  /api/v1/telemetry:
    get:
      summary: Host and Pipeline Telemetry
      description: Returns live CPU, RAM, GPU, Disk metrics and active job state.
      responses:
        '200':
          description: Telemetry data retrieved successfully

  /api/v1/teacher/presets:
    get:
      summary: Teacher LLM Presets
      description: Lists preset configurations for local (Ollama, llama.cpp, vLLM) and commercial (Gemini, Grok, OpenAI) teachers.
      responses:
        '200':
          description: Supported teacher providers and presets

  /api/v1/teacher/models:
    get:
      summary: Discover Hosted Teacher Models
      parameters:
        - name: provider
          in: query
          required: true
          schema:
            type: string
        - name: base_url
          in: query
          required: false
          schema:
            type: string
        - name: api_key
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: List of models hosted on teacher instance

  /api/v1/teacher/test:
    post:
      summary: Test Teacher Connectivity & Model Listing
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [provider, base_url]
              properties:
                provider:
                  type: string
                  enum: [ollama, llamacpp, vllm, gemini, grok, openai, custom]
                base_url:
                  type: string
                api_key:
                  type: string
                model:
                  type: string
      responses:
        '200':
          description: Connection verification results and latency

  /api/v1/training/start:
    post:
      summary: Start Fine-Tuning Job
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                method:
                  type: string
                  enum: [qlora, lora, fft]
                  default: qlora
                model_id:
                  type: string
                  default: meta-llama/Meta-Llama-3-8B-Instruct
                epochs:
                  type: integer
                  default: 3
                batch_size:
                  type: integer
                  default: 4
                grad_accum:
                  type: integer
                  default: 4
                lora_r:
                  type: integer
                  default: 16
                lora_alpha:
                  type: integer
                  default: 32
                lora_dropout:
                  type: number
                  default: 0.05
                learning_rate:
                  type: number
                  default: 0.0002
                max_seq_length:
                  type: integer
                  default: 1024
      responses:
        '200':
          description: Job started successfully
        '409':
          description: Another job is currently active

  /api/v1/training/stop:
    post:
      summary: Abort Active Training Job
      responses:
        '200':
          description: Abort signal sent
        '400':
          description: No active process running

  /api/v1/admin/hardware-bounds:
    get:
      summary: Physical Host Limits & Bounds
      responses:
        '200':
          description: Live detected hardware limits
